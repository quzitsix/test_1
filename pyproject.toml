[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowbench"
version = "0.1.0"
description = "Model-agnostic benchmark for household long-term spatial memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Video decoding, needed by every adapter that looks at frames. ffmpeg is
# intentionally NOT required: PyAV is used as a library, so the harness works on
# machines without ffmpeg on PATH.
video = ["av>=12.0", "pillow>=10.0"]
# Local HF vision-language models (hf_vlm adapter). Install a CUDA-matched torch
# separately; pip's default wheel may be CPU-only.
hf = [
    "av>=12.0",
    "pillow>=10.0",
    "torch",
    # 4.56 is the floor for two reasons: `dtype=` (older versions silently
    # ignore it and load fp32), and Qwen3-VL support. 4.57.x is what we
    # verified against; do not drop below it casually.
    "transformers>=4.56",
    "accelerate>=1.0",
    "safetensors",
]
# OpenAI-compatible endpoints (openai_compat adapter) and LLM judges.
api = ["av>=12.0", "pillow>=10.0", "openai>=1.40", "httpx>=0.27"]
# Review UI (M3).
audit = ["fastapi>=0.110", "uvicorn>=0.29"]
# Debias stage (M4).
debias = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "av>=12.0", "pillow>=10.0", "openai>=1.40"]

[project.scripts]
meowbench = "meowbench.cli:main"

[tool.setuptools.packages.find]
include = ["meowbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Protocol tests spawn subprocesses; a hang must fail rather than block CI.
timeout = 120
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
