[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowbench"
version = "0.1.0"
description = "Model-agnostic benchmark for household long-term spatial memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Video decoding. ffmpeg is intentionally not required: PyAV is used as a
# library so the harness works on machines without ffmpeg on PATH.
video = ["av>=12.0"]
# Local VLM adapters (M2).
hf = ["torch", "transformers>=4.49", "accelerate>=0.34"]
# API adapters and LLM judges (M2/M4).
api = ["openai>=1.40", "httpx>=0.27"]
# Review UI (M3).
audit = ["fastapi>=0.110", "uvicorn>=0.29"]
# Debias stage (M4).
debias = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
meowbench = "meowbench.cli:main"

[tool.setuptools.packages.find]
include = ["meowbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Protocol tests spawn subprocesses; a hang must fail rather than block CI.
timeout = 120
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
